services:
  mongodb:
    # Keep in step with the root docker-compose.yml (see the note there on upgrades).
    image: mongo:7.0.43
    container_name: expense-tracker-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    # Local development only: reachable from this machine, not from the network.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # Single-node replica set so transactions work (see the root compose file).
    # The member is advertised as localhost:27017, which is how everything on
    # this machine (the backend in dev, tests, scripts) reaches it.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
      start_interval: 1s

  expensive-tracker-backend:
    image: expense-tracker-backend:latest
    container_name: expense-tracker-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # directConnection: the replica set advertises localhost:27017, which from
      # inside this container is the container itself, not the database.
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/expense-tracker?directConnection=true&authSource=admin
      # Never hardcode this. Supplied from the host environment or a .env file next
      # to this compose file. Left empty here on purpose: an empty value makes the
      # backend exit at boot with a clear message (see src/config/validateEnv.js),
      # while a required-var syntax would also block `compose up mongodb` alone.
      - "JWT_SECRET=${JWT_SECRET:-}"
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
