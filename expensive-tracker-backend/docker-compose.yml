services:
  mongodb:
    image: mongo:latest
    container_name: expense-tracker-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  expensive-tracker-backend:
    image: expense-tracker-backend:latest
    container_name: expense-tracker-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/expense-tracker
      - JWT_SECRET=your-secure-secret-key-here
      - FRONTEND_URL=http://localhost:4200
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
