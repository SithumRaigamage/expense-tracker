version: '3.8'

services:
  expensive-tracker-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
