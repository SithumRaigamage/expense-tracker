version: '3.8'

services:
  expensive-tracker-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

