services:
  expensive-tracker-frontend:
    image: expense-tracker-frontend:latest
    container_name: expense-tracker-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://localhost:3001/api/v1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - expense-tracker-network

networks:
  expense-tracker-network:
    driver: bridge
