# SonarQube project configuration (local only; ignored by VCS)
sonar.projectKey=expense-tracker-frontend
sonar.projectName=Expense Tracker Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/environments/**,**/*.js,dist/**

# Node/TypeScript
sonar.typescript.tsconfigPath=tsconfig.json
# If coverage lcov is available, set its path; otherwise Sonar will skip coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# SonarQube server URL (override with SONAR_HOST_URL if needed)
sonar.host.url=http://localhost:9000
