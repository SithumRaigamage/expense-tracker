<div
  class="relative flex flex-col items-center justify-center overflow-hidden rounded-2xl border
         border-dashed border-subtle px-6 text-center surface-2"
  [ngClass]="paddingClass"
  >
  <!-- A faint brand glow behind the icon, so an empty panel still reads as part
       of the product rather than a hole where content failed to load. -->
  <div aria-hidden="true"
    class="pointer-events-none absolute left-1/2 top-0 h-40 w-40 -translate-x-1/2 -translate-y-1/2
           rounded-full bg-brand-500/10 blur-3xl"></div>

  <div
    class="relative inline-flex h-14 w-14 items-center justify-center rounded-2xl surface-1
           text-tertiary shadow-theme-sm"
    >
    <fa-icon [icon]="icon" class="text-xl"></fa-icon>
  </div>

  <h3 class="relative mt-4 font-semibold text-primary">{{ title }}</h3>

  @if (message) {
    <p class="relative mt-1.5 max-w-sm text-sm leading-relaxed text-secondary">
      {{ message }}
    </p>
  }

  <!-- Kept on one line so the wrapper is truly :empty (and stays collapsed) when no action is projected. -->
  <div class="relative mt-6 empty:hidden empty:mt-0"><ng-content></ng-content></div>
</div>
