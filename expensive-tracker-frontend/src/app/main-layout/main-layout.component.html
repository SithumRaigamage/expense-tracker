<div class="flex min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Sidebar Component (Handles its own fixed positioning and responsive width) -->
  <app-sidebar></app-sidebar>

  <!-- Content Area -->
  <!--
    The left margin has to track the sidebar's own width, which collapses to
    w-24 when the sidebar is not expanded. Hard-coding lg:ml-72 left twelve rems
    of dead space beside the collapsed rail.
  -->
  <div class="flex flex-col flex-1 min-w-0 transition-[margin] duration-300 ease-in-out"
    [class.lg:ml-72]="isSidebarExpanded"
    [class.lg:ml-24]="!isSidebarExpanded">
    <!-- Header -->
    <div class="sticky top-0 z-30">
      <app-header></app-header>
    </div>

    <!-- Main Content -->
    <main class="w-full p-4 md:p-6 2xl:p-10">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
