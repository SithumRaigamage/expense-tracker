<aside class="relative h-full z-50">
  <!-- Mobile Backdrop -->
  <div *ngIf="isMobileOpen" 
       class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-30 lg:hidden transition-opacity duration-300"
       (click)="sidebarService.toggleMobile()"></div>

  <!-- Sidebar -->
  <div class="fixed flex flex-col top-0 left-0 h-screen bg-white/90 backdrop-blur-xl dark:bg-gray-900/95 border-r border-gray-100 dark:border-gray-800 text-gray-900 transition-transform duration-300 ease-in-out z-40 shadow-sm"
       [class.translate-x-0]="isMobileOpen"
       [class.-translate-x-full]="!isMobileOpen"
       [class.lg:translate-x-0]="true"
       [class.w-72]="isExpanded || isHovered"
       [class.lg:w-72]="isExpanded || isHovered"
       [class.lg:w-24]="!isExpanded && !isHovered"
       (mouseenter)="!isExpanded && (isHovered = true)"
       (mouseleave)="isHovered = false">

    <!-- Logo Section -->
    <div class="flex-shrink-0 h-20 flex items-center justify-center border-b border-gray-100 dark:border-gray-800/50">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-brand-500 text-white shadow-lg shadow-brand-500/20">
          <fa-icon [icon]="moneyIcon" class="text-lg"></fa-icon>
        </div>
        <span class="text-xl font-bold tracking-tight text-gray-900 dark:text-white" [class.hidden]="!isExpanded && !isHovered">
          Expensify
        </span>
      </div>
    </div>

    <!-- Navigation Links -->
    <div class="flex-1 overflow-y-auto px-4 py-6 scrollbar-thin scrollbar-thumb-gray-200 dark:scrollbar-thumb-gray-700">
      <div class="space-y-8">
        <!-- Main Menu Items -->
        <div class="space-y-1">
          <h2 class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 transition-opacity duration-200"
              [class.opacity-0]="!isExpanded && !isHovered"
              [class.text-center]="!isExpanded && !isHovered"
              [class.hidden]="!isExpanded && !isHovered">
            Dashboard
          </h2>

          <!-- Navigation Items -->
          <ng-container *ngFor="let item of navItems">
            <div *ngIf="!item.isLocked" class="relative group">
              <a [routerLink]="item.path"
                 routerLinkActive="menu-item-active"
                 #rla="routerLinkActive"
                 class="menu-item menu-item-inactive mb-1">

                <!-- Icon -->
                <div class="menu-item-icon-size flex-shrink-0 flex items-center justify-center" 
                     [class.menu-item-icon-active]="rla.isActive"
                     [class.menu-item-icon-inactive]="!rla.isActive">
                  <fa-icon [icon]="item.icon"></fa-icon>
                </div>

                <!-- Name and Badges Container -->
                <div class="flex-1 flex items-center justify-between min-w-0 overflow-hidden transition-all duration-200"
                     [class.w-0]="!isExpanded && !isHovered"
                     [class.opacity-0]="!isExpanded && !isHovered"
                     [class.ml-0]="!isExpanded && !isHovered">
                  <!-- Name -->
                  <span class="truncate">{{ item.name }}</span>

                  <!-- Badges Container -->
                  <div class="flex items-center gap-2 ml-2 flex-shrink-0">
                    <span *ngIf="item.isNew"
                          class="flex items-center gap-1 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-brand-100 text-brand-600 rounded-full dark:bg-brand-500/20 dark:text-brand-400">
                      NEW
                    </span>
                  </div>
                </div>
              </a>
            </div>
          </ng-container>
        </div>

        <!-- Others Section -->
        <div class="space-y-1">
          <h2 class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 transition-opacity duration-200"
              [class.opacity-0]="!isExpanded && !isHovered"
              [class.text-center]="!isExpanded && !isHovered"
              [class.hidden]="!isExpanded && !isHovered">
            Management
          </h2>

          <ng-container *ngFor="let item of othersItems">
            <div *ngIf="shouldDisplayItem(item)" class="relative group">
              <!-- Main Item -->
              <a [routerLink]="item.subItems ? null : item.path"
                 (click)="item.subItems && toggleSubNav(item, $event)"
                 [class.menu-item-active]="(!item.subItems && rlaOthers.isActive) || (item.subItems && item.isOpen)" 
                 class="menu-item menu-item-inactive mb-1 cursor-pointer"
                 #rlaOthers="routerLinkActive"
                 [routerLinkActive]="item.subItems ? '' : 'active-link-dummy'"> <!-- Dummy class to trigger rlaOthers -->
                 
                <!-- Icon -->
                <div class="menu-item-icon-size flex-shrink-0 flex items-center justify-center"
                     [class.menu-item-icon-active]="(!item.subItems && rlaOthers.isActive) || (item.subItems && item.isOpen)"
                     [class.menu-item-icon-inactive]="!((!item.subItems && rlaOthers.isActive) || (item.subItems && item.isOpen))">
                  <fa-icon [icon]="item.icon"></fa-icon>
                </div>

                <!-- Name and Content -->
                <div class="flex-1 flex items-center justify-between min-w-0 overflow-hidden transition-all duration-200"
                     [class.w-0]="!isExpanded && !isHovered"
                     [class.opacity-0]="!isExpanded && !isHovered"
                     [class.ml-0]="!isExpanded && !isHovered">
                  <span class="truncate">{{ item.name }}</span>
                  <fa-icon
                    *ngIf="item.subItems"
                    [icon]="chevronRight"
                    class="w-3 h-3 transition-transform duration-200 ml-2"
                    [class.rotate-90]="item.isOpen">
                  </fa-icon>
                </div>
              </a>

              <!-- Sub Items -->
              <div *ngIf="item.subItems && item.isOpen && (isExpanded || isHovered)"
                   class="ml-4 mt-1 space-y-1 border-l border-gray-100 dark:border-gray-800 pl-3">
                <ng-container *ngFor="let subItem of item.subItems">
                  <a *ngIf="!subItem.isLocked" [routerLink]="subItem.path"
                     routerLinkActive="menu-dropdown-item-active"
                     class="menu-dropdown-item menu-dropdown-item-inactive">
                    <span class="truncate">{{ subItem.name }}</span>
                  </a>
                </ng-container>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    
    <!-- Profile / Bottom Section -->
    <div class="p-4 border-t border-gray-100 dark:border-gray-800/50 mt-auto">
      <!-- Can add simple user profile summary here later if needed -->
    </div>
  </div>
</aside>
