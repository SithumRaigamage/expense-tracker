<!--
  Sticky frosted bar. `backdrop-filter` is deliberately confined to persistent
  chrome like this rather than applied per card — it is a per-frame GPU cost,
  and a page full of frosted panels is where glassmorphism starts dropping frames.
-->
<header class="glass sticky top-0 z-30 w-full border-x-0 border-t-0 border-b">
  <div class="mx-auto flex h-16 w-full max-w-[1600px] items-center gap-3 px-4 md:h-20 md:gap-4 md:px-6 2xl:px-8">

    <!--
      One control, two jobs: it collapses the rail on desktop and opens the
      overlay on mobile, so the accessible name has to say which one it will do.
    -->
    <button
      type="button"
      (click)="handleToggle()"
      [attr.aria-label]="isMobileOpen ? 'Close navigation menu' : (isSidebarExpanded ? 'Collapse navigation' : 'Expand navigation')"
      [attr.aria-expanded]="isMobileOpen || isSidebarExpanded"
      aria-controls="app-sidebar"
      class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-gray-200 bg-white/70
             text-gray-500 transition-all duration-200 hover:border-gray-300 hover:bg-white
             hover:text-gray-800 active:scale-95 dark:border-white/10 dark:bg-white/5
             dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100 md:h-11 md:w-11">
      <!-- Three bars that fold into a cross. Animating the bars rather than
           swapping two icons keeps the control reading as a single object. -->
      <span class="relative block h-4 w-[18px]" aria-hidden="true">
        <span class="absolute left-0 block h-[1.5px] w-full rounded-full bg-current transition-all duration-300 ease-[var(--ease-out-quint)]"
          [class.top-0]="!isMobileOpen"
          [class.top-1.5]="isMobileOpen"
          [class.rotate-45]="isMobileOpen"></span>
        <span class="absolute left-0 top-1.5 block h-[1.5px] w-full rounded-full bg-current transition-all duration-200"
          [class.opacity-0]="isMobileOpen"
          [class.scale-x-50]="isMobileOpen"></span>
        <span class="absolute left-0 block h-[1.5px] rounded-full bg-current transition-all duration-300 ease-[var(--ease-out-quint)]"
          [class.bottom-0]="!isMobileOpen"
          [class.w-2/3]="!isMobileOpen"
          [class.top-1.5]="isMobileOpen"
          [class.w-full]="isMobileOpen"
          [class.-rotate-45]="isMobileOpen"></span>
      </span>
    </button>

    <!-- Brand, phone only — the sidebar carries it from lg up. -->
    <a routerLink="/" class="flex items-center gap-2 lg:hidden">
      <img src="assets/images/logo.svg" alt=""
        class="h-8 w-8 rounded-lg shadow-lg shadow-brand-500/20" width="32" height="32">
      <span class="text-lg font-bold tracking-tight text-primary">Expensify</span>
    </a>

    <!--
      The route's own title, so each screen identifies itself in the chrome.
      aria-hidden because every page still owns the real <h1>; exposing this too
      would announce the same title twice.
    -->
    <div class="hidden min-w-0 flex-1 lg:block" aria-hidden="true">
      @if (pageTitle()) {
        <h2 class="truncate text-xl font-semibold tracking-tight text-primary">
          {{ pageTitle() }}
        </h2>
      }
    </div>

    <!-- Pushes the controls right on the breakpoints where the title is hidden. -->
    <div class="flex-1 lg:hidden"></div>

    <!--
      These previously sat behind a kebab toggle on mobile, which buried the
      currency switcher and the account menu two taps deep. They are small
      enough to stay visible; only the currency switcher drops off the very
      narrowest screens.
    -->
    <div class="flex shrink-0 items-center gap-2 md:gap-3">
      <!--
        Held back to `sm` (640px). The `2xsm` breakpoint is 375px, so on a
        standard iPhone the switcher appeared at exactly the width where the
        cluster no longer fits and pushed the header 15px past the viewport.
        Currency also lives in Settings, so nothing is unreachable on a phone.
      -->
      <div class="hidden sm:block">
        <app-currency-switcher></app-currency-switcher>
      </div>
      <app-theme-toggle-button></app-theme-toggle-button>
      <app-user-dropdown></app-user-dropdown>
    </div>
  </div>
</header>
