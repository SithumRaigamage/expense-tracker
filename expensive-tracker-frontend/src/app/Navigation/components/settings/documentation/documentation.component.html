<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!--
    The "Download PDF" button that sat here has been removed: there is no PDF in
    the project and its click handler was an empty method, so it was a control
    that looked like a download and did nothing.
  -->
  <div class="col-span-12">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-primary">Documentation</h1>
      <p class="mt-1 text-sm text-secondary">How the main parts of Expensify fit together.</p>
    </div>
  </div>

  <div class="col-span-12">
    <div class="card divide-y divide-[var(--border-subtle)] p-6">
      <!--
        The video player and screenshot grid are gone. Both pointed at
        directories that do not exist (`assets/videos`, `assets/images/docs`),
        so every section rendered an empty player stuck at 0:00 and a row of
        broken-image icons.
      -->
      @for (section of sections; track section.title) {
        <section class="py-6 first:pt-0 last:pb-0">
          <h2 class="text-lg font-semibold text-primary">{{ section.title }}</h2>
          <p class="mt-2 max-w-3xl text-sm leading-relaxed text-secondary">{{ section.content }}</p>

          @if (section.route) {
            <a [routerLink]="section.route"
              class="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold text-brand-600 transition-colors hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300">
              {{ section.routeLabel }}
              <span aria-hidden="true">→</span>
            </a>
          }
        </section>
      }
    </div>
  </div>

  <div class="col-span-12">
    <div class="card p-6">
      <h2 class="mb-4 text-lg font-semibold text-primary">Quick links</h2>
      <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
        <!--
          Was `href="/help/faqs"`, a full page reload that threw away the
          Angular app and re-bootstrapped it. routerLink navigates in place.
        -->
        <a routerLink="/help/faqs"
          class="flex items-center gap-2.5 rounded-xl border border-subtle p-4 text-sm font-medium text-secondary transition-all duration-200 hover:border-brand-500/40 hover:text-primary hover:shadow-theme-sm">
          <fa-icon [icon]="bookIcon" class="text-brand-600 dark:text-brand-400"></fa-icon>
          <span>Frequently asked questions</span>
        </a>
        <a routerLink="/help/troubleshooting"
          class="flex items-center gap-2.5 rounded-xl border border-subtle p-4 text-sm font-medium text-secondary transition-all duration-200 hover:border-brand-500/40 hover:text-primary hover:shadow-theme-sm">
          <fa-icon [icon]="bookIcon" class="text-brand-600 dark:text-brand-400"></fa-icon>
          <span>Troubleshooting</span>
        </a>
        <a routerLink="/help/support"
          class="flex items-center gap-2.5 rounded-xl border border-subtle p-4 text-sm font-medium text-secondary transition-all duration-200 hover:border-brand-500/40 hover:text-primary hover:shadow-theme-sm">
          <fa-icon [icon]="bookIcon" class="text-brand-600 dark:text-brand-400"></fa-icon>
          <span>Contact support</span>
        </a>
      </div>
    </div>
  </div>
</div>
