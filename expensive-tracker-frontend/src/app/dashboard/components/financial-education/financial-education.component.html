<div class="rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
  <!-- Header -->
  <div class="flex flex-col gap-2 mb-6 sm:flex-row sm:items-center sm:justify-between">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white">Financial Education</h2>

    <!-- Category Filter -->
    <div class="flex items-center gap-4">
      <select [(ngModel)]="selectedCategory"
        class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white">
        <option value="all">All Categories</option>
        <option value="budgeting">Budgeting</option>
        <option value="investing">Investing</option>
        <option value="savings">Savings</option>
      </select>
    </div>
  </div>

  <!-- Content Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (content of educationalContent; track content) {
      <div
        class="rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="relative pt-[56.25%] bg-gradient-to-br from-brand-50 to-brand-100 dark:from-gray-800 dark:to-gray-700">
          <img [src]="content.thumbnail"
            [alt]="content.title"
            (error)="onThumbnailError($event)"
            class="absolute inset-0 w-full h-full object-cover">
        </div>
        <div class="p-4">
          <div class="flex items-center gap-2 mb-2">
          <span [class]="'px-2 py-1 text-xs rounded-full ' +
            (content.type === 'video' ? 'bg-blue-100 text-blue-800' :
             content.type === 'article' ? 'bg-green-100 text-green-800' :
             'bg-purple-100 text-purple-800')">
              {{content.type}}
            </span>
            <span class="text-sm text-gray-500 dark:text-gray-400">{{content.duration}}</span>
          </div>
          <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">{{content.title}}</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">{{content.description}}</p>
          <button class="text-brand-500 hover:text-brand-600 font-medium text-sm">
            Learn More →
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Glossary Section -->
  <div class="mt-8">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Financial Glossary</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      @for (term of glossary; track term) {
        <div
          class="p-4 rounded-lg border border-gray-200 dark:border-gray-700">
          <h4 class="font-medium text-gray-900 dark:text-white mb-1">{{term.term}}</h4>
          <p class="text-sm text-gray-500 dark:text-gray-400">{{term.definition}}</p>
        </div>
      }
    </div>
  </div>
</div>
