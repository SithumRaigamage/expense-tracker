<div
  class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 h-full flex flex-col"
>
  <div class="flex flex-col gap-4 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-xl font-bold text-gray-900">Financial Flow Analysis</h3>
      <p class="text-sm text-gray-500 mt-1">{{ breakdownSubtitle }}</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="bg-brand-50 p-2 rounded-lg">
        <fa-icon [icon]="faChartPie" class="text-brand-600"></fa-icon>
      </div>
      <div class="flex items-center gap-2">
        <button
          (click)="setBreakdownTab('sankey')"
          class="px-3 py-1 text-sm rounded-md border"
          [ngClass]="{
            'bg-brand-50 border-brand-200 text-brand-700 dark:bg-brand-900/10 dark:border-brand-800/30 dark:text-brand-300':
              breakdownTab === 'sankey',
            'bg-white border-gray-200 text-gray-700': breakdownTab !== 'sankey',
          }"
        >
          Sankey
        </button>
        <button
          (click)="setBreakdownTab('sunburst')"
          class="px-3 py-1 text-sm rounded-md border"
          [ngClass]="{
            'bg-brand-50 border-brand-200 text-brand-700 dark:bg-brand-900/10 dark:border-brand-800/30 dark:text-brand-300':
              breakdownTab === 'sunburst',
            'bg-white border-gray-200 text-gray-700':
              breakdownTab !== 'sunburst',
          }"
        >
          Sunburst
        </button>
      </div>
    </div>
  </div>

  <div class="flex-1">
    <!-- Loading: shaped like the chart it becomes, so the panel keeps its height -->
    <div *ngIf="isBreakdownLoading" class="space-y-4">
      <app-skeleton width="100%" height="340px" rounded="xl"></app-skeleton>
      <div class="flex gap-3">
        <app-skeleton width="22%" height="0.75rem"></app-skeleton>
        <app-skeleton width="22%" height="0.75rem"></app-skeleton>
        <app-skeleton width="22%" height="0.75rem"></app-skeleton>
      </div>
    </div>

    <app-empty-state
      *ngIf="!isBreakdownLoading && !hasFlowData"
      [icon]="faChartPie"
      title="No data available"
      message="Once you record income and expenses across your wallets, your money flow will be charted here."
      size="lg"
    >
      <a
        routerLink="/transactions"
        class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-brand-600"
      >
        Add a transaction
      </a>
    </app-empty-state>

    <div
      *ngIf="!isBreakdownLoading && hasFlowData"
      echarts
      [options]="breakdownTab === 'sankey' ? sankeyOptions : sunburstOptions"
      class="w-full h-[420px]"
    ></div>
  </div>
</div>
