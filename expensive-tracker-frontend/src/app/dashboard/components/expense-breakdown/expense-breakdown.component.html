<div
  class="card p-6 h-full flex flex-col"
  >
  <div class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex min-w-0 items-center gap-3">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/12 dark:text-brand-400">
        <fa-icon [icon]="faChartPie"></fa-icon>
      </span>
      <div class="min-w-0">
        <h3 class="truncate text-lg font-semibold text-primary">Financial Flow Analysis</h3>
        <p class="mt-0.5 truncate text-sm text-secondary">{{ breakdownSubtitle }}</p>
      </div>
    </div>
    <!--
      Was a hand-rolled pair of bordered buttons whose inactive state was a
      hardcoded `bg-white ... text-gray-700` with no dark variant, so the
      unselected view rendered as a white chip on the dark surface. It uses the
      app's shared segmented control now, like every other view switch.
    -->
    <div class="shrink-0">
      <app-segmented-control
        [options]="breakdownViews"
        [selected]="breakdownTab"
        ariaLabel="Breakdown view"
        (selectedChange)="setBreakdownTab($event)">
      </app-segmented-control>
    </div>
  </div>

  <div class="flex-1">
    <!-- Loading: shaped like the chart it becomes, so the panel keeps its height -->
    @if (isBreakdownLoading) {
      <div class="space-y-4">
        <app-skeleton width="100%" height="340px" rounded="xl"></app-skeleton>
        <div class="flex gap-3">
          <app-skeleton width="22%" height="0.75rem"></app-skeleton>
          <app-skeleton width="22%" height="0.75rem"></app-skeleton>
          <app-skeleton width="22%" height="0.75rem"></app-skeleton>
        </div>
      </div>
    }

    @if (!isBreakdownLoading && !hasFlowData) {
      <app-empty-state
        [icon]="faChartPie"
        title="No data available"
        message="Once you record income and expenses across your wallets, your money flow will be charted here."
        size="lg"
        >
        <a
          routerLink="/transactions"
          class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-brand-700"
          >
          Add a transaction
        </a>
      </app-empty-state>
    }

    @if (!isBreakdownLoading && hasFlowData) {
      <!-- Taller than before: the sankey's node labels need vertical room to
           sit beside their nodes without colliding with the next one. -->
      <div
        echarts
        [options]="breakdownTab === 'sankey' ? sankeyOptions : sunburstOptions"
        class="h-[460px] w-full sm:h-[520px]"
      ></div>
    }
  </div>
</div>
