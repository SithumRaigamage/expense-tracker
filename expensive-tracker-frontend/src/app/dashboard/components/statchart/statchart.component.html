<div class="rounded-2xl border border-gray-200 bg-white px-5 pb-5 pt-5 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:justify-between sm:items-start">
    <div class="flex-1 min-w-0">
      <h3 class="text-lg font-semibold text-gray-800">
        Income vs Expenses
      </h3>
      <p class="mt-1 text-gray-500 text-theme-sm dark:text-gray-400">
        Monthly comparison of income and expenses
      </p>
    </div>
    <div class="flex-shrink-0 w-full sm:w-auto max-w-sm">
      <app-chart-tab (periodChanged)="onPeriodChanged($event)"></app-chart-tab>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!hasTransactions" class="flex flex-col items-center justify-center py-12 text-center">
    <div class="mb-4 rounded-full bg-gray-100 p-6 dark:bg-gray-800">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </div>
    <h3 class="mb-2 text-lg font-semibold text-gray-900 dark:text-white">No Data to Display</h3>
    <p class="max-w-md text-sm text-gray-500 dark:text-gray-400">
      Start adding transactions to see your income vs expenses chart and track your financial trends.
    </p>
  </div>

  <!-- Chart Content -->
  <div *ngIf="hasTransactions" class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="w-full">
      <apx-chart
        #chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [yaxis]="chartOptions.yaxis"
        [grid]="chartOptions.grid"
        [markers]="chartOptions.markers"
        [stroke]="chartOptions.stroke"
        [fill]="chartOptions.fill"
        [colors]="chartOptions.colors"
        [tooltip]="chartOptions.tooltip"
        [legend]="chartOptions.legend"
        [dataLabels]="chartOptions.dataLabels"
      ></apx-chart>
    </div>
  </div>
</div>
