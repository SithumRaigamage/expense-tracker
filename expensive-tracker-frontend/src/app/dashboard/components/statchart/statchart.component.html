<div class="rounded-2xl border border-gray-200 bg-white px-5 pb-5 pt-5 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <div class="flex flex-col gap-4 mb-6 lg:flex-row lg:justify-between lg:items-start">
    <div class="flex-1 min-w-0">
      <h3 class="text-lg font-semibold text-gray-800">
        Income vs Expenses
      </h3>
      <p class="mt-1 text-gray-500 text-theme-sm dark:text-gray-400">
        Monthly comparison of income and expenses
      </p>
    </div>
    <div class="w-full flex-shrink-0 lg:w-auto lg:max-w-sm">
      <app-chart-tab (periodChanged)="onPeriodChanged($event)"></app-chart-tab>
    </div>
  </div>

  <!-- Loading: chart-shaped placeholder, so the panel keeps its height -->
  @if (isLoading) {
    <div class="space-y-3">
      <app-skeleton width="100%" height="280px" rounded="xl"></app-skeleton>
      <div class="flex justify-between gap-2">
        <app-skeleton width="18%" height="0.75rem"></app-skeleton>
        <app-skeleton width="18%" height="0.75rem"></app-skeleton>
        <app-skeleton width="18%" height="0.75rem"></app-skeleton>
        <app-skeleton width="18%" height="0.75rem"></app-skeleton>
      </div>
    </div>
  }

  @if (!isLoading && !hasTransactions) {
    <app-empty-state
      [icon]="faChartLine"
      title="No data available"
      message="This comparison fills in as soon as you log your first income or expense."
      size="lg"
    ></app-empty-state>
  }

  @if (!isLoading && hasTransactions) {
    <div class="max-w-full overflow-x-auto custom-scrollbar">
      <div class="w-full">
        <apx-chart
          #chart
          [series]="chartOptions.series"
          [chart]="chartOptions.chart"
          [xaxis]="chartOptions.xaxis"
          [yaxis]="chartOptions.yaxis"
          [grid]="chartOptions.grid"
          [markers]="chartOptions.markers"
          [stroke]="chartOptions.stroke"
          [fill]="chartOptions.fill"
          [colors]="chartOptions.colors"
          [tooltip]="chartOptions.tooltip"
          [legend]="chartOptions.legend"
          [dataLabels]="chartOptions.dataLabels"
        ></apx-chart>
      </div>
    </div>
  }
</div>
