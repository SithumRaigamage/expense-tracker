<div class="card overflow-hidden p-4 sm:p-6 mt-5">
  <div class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Monthly transactions
    </h3>
    <div class="flex items-start w-full gap-3 sm:justify-end">
      <app-monthly-transaction-tab
        (tabChanged)="onTabChanged($event)"
      ></app-monthly-transaction-tab>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="transactions.length === 0 && !isLoading" class="flex flex-col items-center justify-center py-12 text-center">
    <div class="mb-4 rounded-full bg-gray-100 p-6 dark:bg-gray-800">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    </div>
    <h3 class="mb-2 text-lg font-semibold text-gray-900 dark:text-white">No Transaction Data</h3>
    <p class="max-w-md text-sm text-gray-500 dark:text-gray-400">
      Add transactions to see your monthly statistics and trends.
    </p>
  </div>

  <!-- Chart Content -->
  <div *ngIf="transactions.length > 0" class="max-w-full">
    <div class="w-full">
      <app-chart
        [chartType]="currentChartType"
        [transactions]="transactions"
      ></app-chart>
    </div>
  </div>
</div>
