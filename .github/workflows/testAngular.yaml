name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:7.0.43
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'try{rs.status()}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]})};quit(db.hello().isWritablePrimary?0:1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
          --name mongodb
        env:
          MONGODB_EXTRA_FLAGS: --replSet rs0

    env:
      MONGODB_URI: mongodb://localhost:27017/expense-tracker-test?replicaSet=rs0

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './expensive-tracker-backend/package-lock.json'

      # MongoDB service containers don't support --replSet in the command
      # directly, so we initiate the replica set after the container starts.
      - name: Initiate MongoDB replica set
        run: |
          until mongosh --quiet --eval "db.hello().isWritablePrimary" mongodb://localhost:27017 2>/dev/null | grep -q true; do
            mongosh --quiet --eval "try{rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})}catch(e){}" mongodb://localhost:27017 2>/dev/null || true
            sleep 2
          done

      - name: Install Dependencies
        working-directory: ./expensive-tracker-backend
        run: npm ci

      - name: Lint
        working-directory: ./expensive-tracker-backend
        run: npm run lint

      - name: Run Tests
        working-directory: ./expensive-tracker-backend
        run: npm test

  # ─── Frontend ───────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './expensive-tracker-frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./expensive-tracker-frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./expensive-tracker-frontend
        run: |
          npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

      - name: Run Linting
        working-directory: ./expensive-tracker-frontend
        run: npm run lint
