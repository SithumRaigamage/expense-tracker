<div class="rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
  <div class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Recent Transactions
      </h3>
    </div>

    <div class="flex items-center gap-3">
      <button class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Export
      </button>
      <button class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200">
        View All
      </button>
    </div>
  </div>

  <div class="max-w-full overflow-x-auto">
    <table class="w-full">
      <thead>
        <tr class="border-y border-gray-100 dark:border-gray-800">
          <th class="py-3 px-4 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Description</th>
          <th class="py-3 px-4 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Category</th>
          <th class="py-3 px-4 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Date</th>
          <th class="py-3 px-4 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Amount</th>
          <th class="py-3 px-4 font-medium text-gray-500 text-start text-theme-xs dark:text-gray-400">Type</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
        <tr *ngFor="let transaction of transactions">
          <td class="py-3 px-4">
            <div class="flex items-center gap-3">
              <div class="min-w-0">
                <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90">
                  {{transaction.description}}
                </p>
                <span class="text-gray-500 text-theme-xs dark:text-gray-400">
                  {{transaction.paymentMethod}}
                </span>
              </div>
            </div>
          </td>
          <td class="py-3 px-4 text-gray-500 text-theme-sm dark:text-gray-400">{{transaction.category}}</td>
          <td class="py-3 px-4 text-gray-500 text-theme-sm dark:text-gray-400">{{formatDate(transaction.date)}}</td>
          <td class="py-3 px-4 text-gray-500 text-theme-sm dark:text-gray-400">{{formatCurrency(transaction.amount)}}</td>
          <td class="py-3 px-4">
            <app-badge
              [color]="getBadgeColor(transaction.type)"
              variant="light"
              size="sm"
            >
              {{transaction.type | titlecase}}
            </app-badge>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
