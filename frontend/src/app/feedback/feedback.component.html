<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Feedback Categories -->
  <div class="col-span-12">
    <div class="bg-white rounded-lg shadow-sm p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">Share Your Feedback</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <button *ngFor="let category of categories"
                (click)="feedbackForm.patchValue({category: category.id})"
                [class.border-blue-500]="feedbackForm.get('category')?.value === category.id"
                class="p-4 border border-gray-200 rounded-lg hover:border-blue-500 transition-colors">
          <div class="flex items-center gap-3 mb-2">
            <fa-icon [icon]="category.icon" class="text-blue-500"></fa-icon>
            <h3 class="font-medium text-gray-800">{{ category.title }}</h3>
          </div>
          <p class="text-sm text-gray-600">{{ category.description }}</p>
        </button>
      </div>
    </div>
  </div>

  <!-- Feedback Form -->
  <div class="col-span-12">
    <form [formGroup]="feedbackForm" (ngSubmit)="submitFeedback()" class="bg-white rounded-lg shadow-sm p-6 space-y-6">
      <!-- Title -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input type="text" formControlName="title"
               class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Brief summary of your feedback">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="4"
                  class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="Please provide detailed feedback..."></textarea>
      </div>

      <!-- Sentiment Rating -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">How do you feel about this?</label>
        <div class="flex items-center gap-6">
          <button *ngFor="let option of sentimentOptions"
                  type="button"
                  (click)="feedbackForm.patchValue({sentiment: option.value})"
                  [class.ring-2]="feedbackForm.get('sentiment')?.value === option.value"
                  class="flex flex-col items-center p-2 rounded-lg hover:bg-gray-50">
            <span class="text-2xl">{{ option.emoji }}</span>
            <span class="text-xs text-gray-600 mt-1">{{ option.label }}</span>
          </button>
        </div>
      </div>

      <!-- Star Rating -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">Rate your overall experience</label>
        <div class="flex items-center gap-1">
          <button *ngFor="let i of [1,2,3,4,5]"
                  type="button"
                  (click)="setRating(i)"
                  class="text-xl focus:outline-none">
            <fa-icon [icon]="rating >= i ? starSolid : starRegular"
                     [class]="rating >= i ? 'text-yellow-400' : 'text-gray-300'">
            </fa-icon>
          </button>
        </div>
      </div>

      <!-- File Attachments -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Attachments</label>
        <div class="flex items-center gap-2">
          <label class="cursor-pointer px-4 py-2 border border-gray-200 rounded-lg hover:border-blue-500 transition-colors">
            <input type="file" multiple class="hidden" (change)="onFileSelected($event)">
            <div class="flex items-center gap-2">
              <fa-icon [icon]="attachmentIcon" class="text-gray-400"></fa-icon>
              <span class="text-sm text-gray-600">Add files</span>
            </div>
          </label>
          <div class="text-sm text-gray-500" *ngIf="feedbackForm.get('attachments')?.value?.length">
            {{ feedbackForm.get('attachments')?.value?.length }} file(s) selected
          </div>
        </div>
      </div>

      <!-- Device Info (hidden) -->
      <input type="hidden" formControlName="deviceInfo">

      <!-- Submit Button -->
      <button type="submit"
              [disabled]="!feedbackForm.valid"
              class="w-full md:w-auto px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50">
        Submit Feedback
      </button>
    </form>
  </div>
</div>
