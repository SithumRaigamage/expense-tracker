<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Bills</h2>
    <button (click)="openDrawer('add')"
            class="inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-black hover:bg-primary-dark">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Add Bill
    </button>
  </div>

  <!-- Bills List -->
  <div class="space-y-4">
    <div *ngFor="let bill of bills"
         class="rounded-xl border border-gray-200 bg-gray-50 p-6 dark:border-gray-800 dark:bg-gray-800/50">
      <div class="grid grid-cols-12 gap-6 items-center">
        <!-- Left: Bill Info -->
        <div class="col-span-3 flex items-center gap-4">
          <div class="h-10 w-10 flex-shrink-0 rounded-lg overflow-hidden">
            <img [src]="bill.iconUrl"
                 [alt]="bill.provider + ' logo'"
                 class="h-full w-full object-cover">
          </div>
          <div>
            <h4 class="font-medium text-gray-900 dark:text-white">{{bill.name}}</h4>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{bill.provider}}</p>
          </div>
        </div>

        <!-- Middle: Date and Amount -->
        <div class="col-span-6 grid grid-cols-3 gap-6">
          <div class="flex flex-col">
            <span class="text-sm text-gray-500 dark:text-gray-400">Category</span>
            <span class="font-medium text-gray-900 dark:text-white">{{bill.category}}</span>
          </div>
          <div class="flex flex-col">
            <span class="text-sm text-gray-500 dark:text-gray-400">Due Date</span>
            <span class="font-medium text-gray-900 dark:text-white">{{formatDate(bill.dueDate)}}</span>
          </div>
          <div class="flex flex-col">
            <span class="text-sm text-gray-500 dark:text-gray-400">Amount</span>
            <span class="font-medium text-gray-900 dark:text-white">{{formatCurrency(bill.amount)}}</span>
          </div>
        </div>

        <!-- Right: Actions -->
        <div class="col-span-3 flex items-center justify-end gap-2">
          <button (click)="openDrawer('edit', bill)"
                  class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button (click)="deleteBill(bill.id)"
                  class="rounded-lg p-2 text-red-500 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Side Drawer -->
  <div *ngIf="isDrawerOpen"
       class="fixed inset-0 bg-gray-900/50 z-40"
       (click)="closeDrawer()">
  </div>

  <div class="fixed inset-y-0 right-0 w-96 bg-white dark:bg-gray-800 shadow-lg transform transition-transform duration-300 ease-in-out z-50"
       [class.translate-x-full]="!isDrawerOpen"
       [class.translate-x-0]="isDrawerOpen">
    <div class="h-full flex flex-col">
      <!-- Drawer Header -->
      <div class="p-6 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{drawerMode === 'add' ? 'Add New Bill' : 'Edit Bill'}}
        </h2>
      </div>

      <!-- Drawer Content -->
      <div class="p-6 flex-1 overflow-y-auto">
        <form (ngSubmit)="submitForm()" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Bill Name
            </label>
            <input [(ngModel)]="currentBill.name"
                   name="name"
                   type="text"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Category
            </label>
            <select [(ngModel)]="currentBill.category"
                    name="category"
                    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
              <option value="">Select a category</option>
              <option *ngFor="let category of categories" [value]="category">
                {{category}}
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Provider
            </label>
            <input [(ngModel)]="currentBill.provider"
                   name="provider"
                   type="text"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Amount
            </label>
            <input [(ngModel)]="currentBill.amount"
                   name="amount"
                   type="number"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Due Date
            </label>
            <input [(ngModel)]="currentBill.dueDate"
                   name="dueDate"
                   type="date"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Icon URL
            </label>
            <input [(ngModel)]="currentBill.iconUrl"
                   name="iconUrl"
                   type="text"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div class="flex justify-end gap-4">
            <button type="button"
                    (click)="closeDrawer()"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
              Cancel
            </button>
            <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-black bg-primary rounded-lg hover:bg-primary-dark">
              {{drawerMode === 'add' ? 'Add Bill' : 'Save Changes'}}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
