<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Product Budget Goals</h2>
    <button (click)="openDrawer('add')"
            class="px-4 py-2 bg-primary text-black rounded-lg hover:bg-primary-dark">
      Add New Goal
    </button>
  </div>

  <!-- Goals Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let goal of goals"
         class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 border border-gray-200 dark:border-gray-700">
      <img [src]="goal.imageUrl" [alt]="goal.name"
           class="w-full h-48 object-cover rounded-lg mb-4">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">{{goal.name}}</h3>

      <!-- Progress Bar -->
      <div class="relative w-full h-2.5 bg-gray-200 rounded-full overflow-hidden mb-4">
        <div class="absolute top-0 left-0 h-full bg-primary transition-all duration-300 ease-in-out"
             [ngStyle]="{
               'width': (goal.savedAmount / goal.targetAmount) * 100 + '%',
               'background-color': getProgressColor((goal.savedAmount / goal.targetAmount) * 100)
             }">
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <span class="text-sm text-gray-600 dark:text-gray-400">
          {{goal.savedAmount | currency:'LKR '}} / {{goal.targetAmount | currency:'LKR '}}
        </span>
        <span class="text-sm text-gray-600 dark:text-gray-400">
          {{(goal.savedAmount / goal.targetAmount) * 100 | number:'1.0-0'}}%
        </span>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-2">
        <button (click)="openDrawer('edit', goal)"
                class="px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">
          Edit
        </button>
        <button (click)="openDrawer('addMoney', goal)"
                class="px-3 py-1 text-sm bg-green-500 text-white rounded hover:bg-green-600">
          Add Money
        </button>
        <button (click)="deleteGoal(goal.id)"
                class="px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Side Drawer Backdrop -->
  <div *ngIf="isDrawerOpen"
       class="fixed inset-0 bg-gray-900/50 z-40"
       (click)="closeDrawer()">
  </div>

  <!-- Side Drawer -->
  <div class="fixed inset-y-0 right-0 w-96 bg-white dark:bg-gray-800 shadow-lg transform transition-transform duration-300 ease-in-out z-50"
       [class.translate-x-full]="!isDrawerOpen"
       [class.translate-x-0]="isDrawerOpen">
    <div class="h-full flex flex-col">
      <!-- Drawer Header -->
      <div class="p-6 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
          {{getDrawerTitle()}}
        </h2>
      </div>

      <!-- Drawer Content -->
      <div class="p-6 flex-1 overflow-y-auto">
        <!-- Add/Edit Form -->
        <form *ngIf="drawerMode === 'add' || drawerMode === 'edit'"
              (ngSubmit)="submitForm()"
              class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Goal Name
            </label>
            <input [(ngModel)]="currentGoal.name"
                   name="name"
                   type="text"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                   placeholder="Enter goal name">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Image URL
            </label>
            <input [(ngModel)]="currentGoal.imageUrl"
                   name="imageUrl"
                   type="text"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                   placeholder="Enter image URL">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Target Amount
            </label>
            <input [(ngModel)]="currentGoal.targetAmount"
                   name="targetAmount"
                   type="number"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                   placeholder="0.00">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Target Date
            </label>
            <input [(ngModel)]="currentGoal.targetDate"
                   name="targetDate"
                   type="date"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white">
          </div>

          <div class="flex justify-end gap-4">
            <button type="button"
                    (click)="closeDrawer()"
                    class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600">
              Cancel
            </button>
            <button type="submit"
                    class="rounded-lg bg-primary-500 px-4 py-2 text-sm font-medium text-black hover:bg-primary-600">
              {{drawerMode === 'add' ? 'Add Goal' : 'Save Changes'}}
            </button>
          </div>
        </form>

        <!-- Add Money Form -->
        <form *ngIf="drawerMode === 'addMoney'"
              (ngSubmit)="submitAddMoney()"
              class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Amount
            </label>
            <input [(ngModel)]="addAmount"
                   name="amount"
                   type="number"
                   class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                   placeholder="0.00">
          </div>

          <div class="flex justify-end gap-4">
            <button type="button"
                    (click)="closeDrawer()"
                    class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600">
              Cancel
            </button>
            <button type="submit"
                    class="rounded-lg bg-primary-500 px-4 py-2 text-sm font-medium text-black hover:bg-primary-600">
              Add Money
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
