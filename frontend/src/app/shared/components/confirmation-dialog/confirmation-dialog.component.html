<div class="confirmation-dialog">
  <div class="confirmation-dialog-header" [ngClass]="data.iconColor">
    <mat-icon class="header-icon">{{ data.icon }}</mat-icon>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="confirmation-dialog-content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    <button
      mat-raised-button
      [color]="data.iconColor === 'warn' ? 'warn' : 'primary'"
      (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
