<div class="relative">
  <!-- Notification Bell Button -->
  <button
    class="relative flex items-center justify-center text-gray-500 transition-colors bg-white border border-gray-200 rounded-full dropdown-toggle hover:text-gray-700 h-11 w-11 hover:bg-gray-100"
    (click)="handleClick()"
  >
    <!-- Notification Badge -->
    <span
      *ngIf="unreadCount > 0"
      class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-red-500 text-xs text-white"
    >
      {{ unreadCount }}
    </span>

    <!-- Bell Icon -->
    <svg
      class="fill-current"
      width="20"
      height="20"
      viewBox="0 0 20 20"
    >
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M10.75 2.29248C10.75 1.87827 10.4143 1.54248 10 1.54248C9.58583 1.54248 9.25004 1.87827 9.25004 2.29248V2.83613C6.08266 3.20733 3.62504 5.9004 3.62504 9.16748V14.4591H3.33337C2.91916 14.4591 2.58337 14.7949 2.58337 15.2091C2.58337 15.6234 2.91916 15.9591 3.33337 15.9591H4.37504H15.625H16.6667C17.0809 15.9591 17.4167 15.6234 17.4167 15.2091C17.4167 14.7949 17.0809 14.4591 16.6667 14.4591H16.375V9.16748C16.375 5.9004 13.9174 3.20733 10.75 2.83613V2.29248ZM14.875 14.4591V9.16748C14.875 6.47509 12.6924 4.29248 10 4.29248C7.30765 4.29248 5.12504 6.47509 5.12504 9.16748V14.4591H14.875ZM8.00004 17.7085C8.00004 18.1228 8.33583 18.4585 8.75004 18.4585H11.25C11.6643 18.4585 12 18.1228 12 17.7085C12 17.2943 11.6643 16.9585 11.25 16.9585H8.75004C8.33583 16.9585 8.00004 17.2943 8.00004 17.7085Z"
      />
    </svg>
  </button>

  <!-- Dropdown Panel -->
  <div
    *ngIf="isOpen"
    class="absolute -right-[240px] mt-[17px] flex h-[480px] w-[350px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-lg sm:w-[361px] lg:right-0"
  >
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-gray-100">
      <h5 class="text-lg font-semibold text-gray-800">
        Notifications ({{ unreadCount }})
      </h5>
      <button
        (click)="toggleDropdown()"
        class="text-gray-500 transition hover:text-gray-700"
      >
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <!-- Notification List -->
    <ul class="flex flex-col h-auto overflow-y-auto custom-scrollbar">
      <li *ngFor="let notification of notifications"
          (click)="markAsRead(notification)"
          class="border-b border-gray-100 last:border-0">
        <div class="flex items-start gap-3 p-4 hover:bg-gray-50 transition-colors rounded-lg"
             [class.bg-blue-50]="!notification.isRead">
          <!-- User Avatar -->
          <div class="relative">
            <img [src]="notification.user.avatar"
                 [alt]="notification.user.name"
                 class="w-10 h-10 rounded-full">
            <span *ngIf="notification.user.isOnline"
                  [class]="'absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white ' + getPriorityStyles(notification.priority)">
            </span>
          </div>

          <!-- Content -->
          <div class="flex-1">
            <p class="text-sm text-gray-800">
              <span class="font-medium">{{ notification.user.name }}</span>
              <span class="ml-1">{{ notification.message }}</span>
            </p>
            <span class="text-xs text-gray-500">{{ getTimeAgo(notification.timestamp) }}</span>
          </div>

          <!-- Priority Indicator -->
          <span [class]="'w-2 h-2 rounded-full mt-2 ' + getPriorityStyles(notification.priority)"></span>
        </div>
      </li>
    </ul>

    <!-- Footer -->
    <a routerLink="/notifications"
       class="mt-3 block text-center py-2 px-4 text-sm font-medium text-gray-700 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors">
      View All Notifications
    </a>
  </div>
</div>
