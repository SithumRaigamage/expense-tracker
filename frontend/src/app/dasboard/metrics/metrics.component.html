<div class="grid gap-4 sm:grid-cols-2 sm:gap-6">
  <div *ngFor="let metric of metrics" class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
          {{metric.label}}
        </p>
        <h4 class="mt-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
          {{formatCurrency(metric.value)}}
        </h4>
      </div>
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-gray-50 dark:bg-white/[0.03]">
        <i class="fa-solid {{metric.icon}} text-xl text-gray-500 dark:text-gray-400"></i>
      </div>
    </div>
    <div class="mt-4">
      <app-badge
        [color]="metric.trend === 'up' ? 'success' : 'error'"
        variant="light"
        size="sm"
      >
        <i class="fa-solid fa-{{metric.trend === 'up' ? 'arrow-up' : 'arrow-down'}} mr-1"></i>
        {{metric.percentage}}%
      </app-badge>
    </div>
  </div>
</div>
