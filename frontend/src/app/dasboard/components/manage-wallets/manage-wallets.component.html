<div class="rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
  <!-- Header Section -->
  <div class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Manage Wallets
      </h3>
    </div>

    <!-- Header Section Button -->
    <div class="flex items-center gap-3">
      <button [routerLink]="['/wallets']"
              class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Wallet
      </button>
    </div>
  </div>

  <!-- Wallets Grid -->
  <div class="grid gap-4">
    <div *ngFor="let wallet of wallets" class="rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-800/50">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div [ngClass]="getWalletIconClass(wallet.type)" class="flex h-10 w-10 items-center justify-center rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
              <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
              <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
            </svg>
          </div>
          <div>
            <h4 class="font-medium text-gray-900 dark:text-white">{{wallet.name}}</h4>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{wallet.type}}</p>
          </div>
        </div>
        <button class="text-gray-400 hover:text-gray-500 dark:text-gray-500 dark:hover:text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
          </svg>
        </button>
      </div>

      <div class="space-y-1">
        <div class="flex justify-between text-sm">
          <span class="text-gray-500 dark:text-gray-400">Balance</span>
          <span class="font-medium text-gray-900 dark:text-white">{{formatCurrency(wallet.balance)}}</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-500 dark:text-gray-400">Currency</span>
          <span class="font-medium text-gray-900 dark:text-white">{{wallet.currency}}</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="wallets.length === 0" class="col-span-full text-center py-8">
      <div class="mx-auto w-16 h-16 text-gray-400 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
          <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
          <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
        </svg>
      </div>
      <h3 class="text-gray-900 font-medium dark:text-white">No wallets yet</h3>
      <p class="text-gray-500 dark:text-gray-400 mt-1">Create your first wallet to start tracking expenses</p>
      <!-- Empty State Button -->
      <button [routerLink]="['/add-wallet']"
              class="mt-4 inline-flex items-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-white hover:bg-primary-dark">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Your First Wallet
      </button>
    </div>
  </div>
</div>
