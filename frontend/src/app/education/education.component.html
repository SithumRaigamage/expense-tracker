<div class="container mx-auto px-4 py-8">
  <!-- Search and Filters -->
  <div class="mb-8 space-y-4">
    <div class="flex gap-4">
      <!-- Search Input -->
      <div class="flex-1 relative">
        <input type="text"
               [(ngModel)]="searchQuery"
               (input)="applyFilters()"
               placeholder="Search educational content..."
               class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:border-blue-500">
        <button *ngIf="searchQuery"
                (click)="searchQuery = ''; applyFilters()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          ✕
        </button>
      </div>

      <!-- Filters -->
      <select [(ngModel)]="selectedDifficulty"
              (change)="applyFilters()"
              class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
        <option value="all">All Levels</option>
        <option *ngFor="let level of difficulties" [value]="level">
          {{level | titlecase}}
        </option>
      </select>

      <select [(ngModel)]="selectedType"
              (change)="applyFilters()"
              class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white">
        <option value="all">All Types</option>
        <option *ngFor="let type of contentTypes" [value]="type">
          {{type | titlecase}}
        </option>
      </select>
    </div>
  </div>

  <!-- Content Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let content of paginatedContent"
         class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
      <!-- Content Card -->
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{content.title}}</h3>
          <button (click)="toggleBookmark(content)"
                  [class.text-yellow-500]="content.bookmarked"
                  class="text-gray-400 hover:text-yellow-500">
            ★
          </button>
        </div>

        <p class="text-gray-600 dark:text-gray-300 mb-4">{{content.description}}</p>

        <!-- Metadata -->
        <div class="flex flex-wrap gap-2 mb-4">
          <span class="px-2 py-1 text-xs rounded-full bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-100">
            {{content.difficulty}}
          </span>
          <span class="px-2 py-1 text-xs rounded-full bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-300">
            {{content.duration}} min
          </span>
          <span class="px-2 py-1 text-xs rounded-full bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-100">
            {{content.type}}
          </span>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-4">
          <div class="bg-blue-500 h-2 rounded-full"
               [style.width]="content.progress + '%'">
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center">
          <button (click)="markAsCompleted(content)"
                  [disabled]="content.completed"
                  class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">
            {{content.completed ? 'Completed' : 'Mark Complete'}}
          </button>

          <!-- Rating -->
          <div class="flex text-yellow-400">
            <button *ngFor="let i of [1,2,3,4,5]"
                    (click)="updateRating(content, i)"
                    [class.text-yellow-400]="(content.rating ?? 0) >= i"
                    [class.text-gray-300]="(content.rating ?? 0) < i">
              ★
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="mt-8 flex justify-center space-x-2">
    <button *ngFor="let page of [].constructor(totalPages); let i = index"
            (click)="currentPage = i + 1"
            [class.bg-blue-500]="currentPage === i + 1"
            [class.text-white]="currentPage === i + 1"
            class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-blue-500 hover:text-white transition-colors">
      {{i + 1}}
    </button>
  </div>
</div>
