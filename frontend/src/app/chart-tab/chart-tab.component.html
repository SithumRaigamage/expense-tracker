<div class="flex items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
  <button
    (click)="setSelected('monthly')"
    [class]="'px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white ' + getButtonClass('monthly')"
  >
    Monthly
  </button>

  <button
    (click)="setSelected('quarterly')"
    [class]="'px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white ' + getButtonClass('quarterly')"
  >
    Quarterly
  </button>

  <button
    (click)="setSelected('annually')"
    [class]="'px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white ' + getButtonClass('annually')"
  >
    Annually
  </button>
</div>
