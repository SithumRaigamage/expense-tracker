<aside class="relative">
  <div class="fixed flex flex-col top-0 left-0 h-screen bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 transition-all duration-300 ease-in-out z-40 border-r border-gray-200"
       [class.w-64]="isOpen"
       [class.w-20]="!isOpen">
    <!-- Logo Section -->
    <div class="py-6 flex items-center justify-center border-b border-gray-200 dark:border-gray-800">
      <img src="assets/images/logo.svg" alt="Logo" class="h-8 w-8">
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 space-y-1 p-4">
      <a *ngFor="let item of navItems"
         [routerLink]="item.link"
         routerLinkActive="bg-gray-50 text-primary dark:bg-gray-800 dark:text-white"
         class="flex items-center gap-x-3 px-3 py-2 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white transition-colors">
        <span [innerHTML]="item.icon | safeHtml" class="flex-shrink-0 w-6 h-6"></span>
        <span class="flex-1" [class.hidden]="!isOpen">{{ item.title }}</span>
        <span *ngIf="item.badge && isOpen"
              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary-100 text-primary-800 dark:bg-primary-900/30 dark:text-primary-500">
          {{ item.badge }}
        </span>
      </a>
    </nav>
  </div>
</aside>
