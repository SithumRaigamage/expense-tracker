<aside class="relative">
  <div class="fixed flex flex-col top-0 left-0 h-screen bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 transition-all duration-300 ease-in-out z-40 border-r border-gray-200"
       [class.w-72]="isExpanded || isHovered"
       [class.w-24]="!isExpanded && !isHovered"
       (mouseenter)="!isExpanded && (isHovered = true)"
       (mouseleave)="isHovered = false">

    <!-- Logo Section -->
    <div class="h-[79px] flex items-center justify-center border-b border-gray-200 dark:border-gray-800">
      <fa-icon [icon]="moneyIcon" size="2x" class="text-gray-900 dark:text-white"></fa-icon>
      <span class="ml-3 text-lg font-semibold text-gray-900 dark:text-white" [class.hidden]="!isExpanded && !isHovered">
        Expense Tracker
      </span>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 space-y-1 p-4">
      <!-- Main Menu Items -->
      <div class="mb-6">
        <h2 class="mb-4 text-xs uppercase text-gray-400"
            [class.text-center]="!isExpanded && !isHovered">
          {{(isExpanded || isHovered) ? 'Menu' : '•••'}}
        </h2>

        <a *ngFor="let item of navItems"
           [routerLink]="item.path"
           routerLinkActive="bg-gray-50 text-primary dark:bg-gray-800 dark:text-white"
           class="flex items-center gap-x-4 px-4 py-3 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white transition-colors mb-2">
          <fa-icon [icon]="item.icon" class="flex-shrink-0 w-6 h-6"></fa-icon>
          <span class="flex-1" [class.hidden]="!isExpanded && !isHovered">{{ item.name }}</span>
        </a>
      </div>

      <!-- Others Section -->
      <div>
        <h2 class="mb-4 text-xs uppercase text-gray-400"
            [class.text-center]="!isExpanded && !isHovered">
          {{(isExpanded || isHovered) ? 'Others' : '•••'}}
        </h2>

        <a *ngFor="let item of othersItems"
           [routerLink]="item.path"
           routerLinkActive="bg-gray-50 text-primary dark:bg-gray-800 dark:text-white"
           class="flex items-center gap-x-4 px-4 py-3 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white transition-colors mb-2">
          <fa-icon [icon]="item.icon" class="flex-shrink-0 w-6 h-6"></fa-icon>
          <span class="flex-1" [class.hidden]="!isExpanded && !isHovered">{{ item.name }}</span>
        </a>
      </div>
    </nav>
  </div>
</aside>
