<!-- Payment Methods Section -->
<div class="rounded-2xl border border-gray-200 bg-white p-5 mt-4 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
  <div class="flex items-center justify-between mb-5 lg:mb-7">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Payment Methods</h3>
    <button
      (click)="addPaymentMethod()"
      class="flex items-center justify-center gap-2 rounded-full border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      Add New
    </button>
  </div>

  <div class="space-y-4">

    <div *ngFor="let method of paymentMethods"
         class="flex items-center justify-between p-4 border border-gray-200 rounded-xl dark:border-gray-700">
      <div class="flex items-center gap-4">
        <div class="flex-shrink-0">
          <fa-icon
            [icon]="getCardIcon(method.type)"
            [class]="method.type === 'visa' ? 'text-blue-600 text-3xl' : 'text-red-500 text-3xl'"
          ></fa-icon>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-900 dark:text-white">
            •••• •••• •••• {{ method.lastFour }}
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Expires {{ method.expiryMonth }}/{{ method.expiryYear }}
          </p>
        </div>
        <span *ngIf="method.isDefault"
              class="ml-2 inline-flex items-center rounded-full bg-primary/10 px-2.5 py-0.5 text-xs font-medium text-primary">
          Default
        </span>
      </div>
      <div class="flex items-center gap-2">
        <button (click)="editPaymentMethod(method.id)"
                class="p-2 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </button>
        <button (click)="deletePaymentMethod(method.id)"
                class="p-2 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>


<div *ngIf="isPaymentModalOpen"
     class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm bg-white/30 dark:bg-black/30">
  <div class="max-w-[500px] m-4">
    <div class="relative w-full overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-8">
      <div class="mb-6">
        <h4 class="text-xl font-semibold text-gray-800 dark:text-white/90">
          {{ isEditMode ? 'Edit Payment Method' : 'Add Payment Method' }}
        </h4>
      </div>

      <form [formGroup]="paymentForm" (ngSubmit)="onPaymentSubmit()" class="space-y-4">
        <div>
          <label class="mb-2.5 block text-black dark:text-white">Card Type</label>
          <select formControlName="type"
                  class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 dark:border-gray-700">
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
          </select>
        </div>

        <div>
          <label class="mb-2.5 block text-black dark:text-white">Last 4 Digits</label>
          <input type="text" formControlName="lastFour"
                 class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 dark:border-gray-700">
          <div *ngIf="paymentForm.get('lastFour')?.errors?.['pattern']"
               class="mt-1 text-sm text-red-500">
            Please enter 4 digits only
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-2.5 block text-black dark:text-white">Expiry Month (MM)</label>
            <input type="number" formControlName="expiryMonth"
                   class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 dark:border-gray-700">
          </div>
          <div>
            <label class="mb-2.5 block text-black dark:text-white">Expiry Year (YY)</label>
            <input type="number" formControlName="expiryYear"
                   class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 dark:border-gray-700">
          </div>
        </div>

        <div class="flex items-center">
          <input type="checkbox" formControlName="isDefault"
                 class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary">
          <label class="ml-2 text-sm text-gray-700 dark:text-gray-300">
            Set as default payment method
          </label>
        </div>

        <div class="flex items-center justify-end gap-3 mt-6">
          <button type="button" (click)="closePaymentModal()"
                  class="rounded-lg border border-gray-300 bg-transparent px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800">
            Cancel
          </button>
          <button type="submit"
                  [disabled]="!paymentForm.valid"
                  class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-black hover:bg-primary-dark disabled:opacity-50">
            {{ isEditMode ? 'Update' : 'Add' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
