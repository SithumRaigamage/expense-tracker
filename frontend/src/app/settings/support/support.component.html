<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Contact Options -->
  <div class="col-span-12">
    <div class="bg-white rounded-lg shadow-sm p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">{{ pageContent.title }}</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div *ngFor="let option of contactOptions"
             class="p-4 border border-gray-200 rounded-lg hover:border-blue-500 transition-colors">
          <div class="flex items-center gap-3 mb-2">
            <fa-icon [icon]="option.icon" class="text-blue-500"></fa-icon>
            <h3 class="font-medium text-gray-800">{{ option.title }}</h3>
          </div>
          <p class="text-sm text-gray-600">{{ option.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Support Hours & Response Times -->
  <div class="col-span-12 xl:col-span-4">
    <div class="bg-white rounded-lg shadow-sm p-6 space-y-6">
      <!-- Support Hours -->
      <div>
        <h2 class="text-xl font-semibold text-gray-800 mb-4">{{ pageContent.supportHoursTitle }}</h2>
        <div class="space-y-3">
          <div *ngFor="let schedule of supportHours"
               class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
            <span class="text-gray-600">{{ schedule.day }}</span>
            <span class="font-medium text-gray-800">{{ schedule.hours }}</span>
          </div>
        </div>
      </div>

      <!-- Response Times -->
      <div>
        <h2 class="text-xl font-semibold text-gray-800 mb-4">{{ pageContent.responseTimesTitle }}</h2>
        <div class="space-y-3">
          <div *ngFor="let item of responseTimes"
               class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
            <span class="text-gray-600">{{ item.channel }}</span>
            <span class="font-medium text-gray-800">{{ item.time }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Support Form -->
  <div class="col-span-12 xl:col-span-8">
    <div class="bg-white rounded-lg shadow-sm p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">{{ pageContent.formTitle }}</h2>
      <form [formGroup]="supportForm" (ngSubmit)="submitSupportRequest()" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <ng-container *ngFor="let field of formFields">
            <div [class]="field.name === 'subject' || field.name === 'message' ? 'col-span-2' : ''">
              <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>

              <ng-container [ngSwitch]="field.type">
                <input *ngSwitchCase="'text'" [type]="field.type"
                       [formControlName]="field.name"
                       class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <input *ngSwitchCase="'email'" type="email"
                       [formControlName]="field.name"
                       class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                <select *ngSwitchCase="'select'"
                        [formControlName]="field.name"
                        class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option *ngFor="let option of field.options"
                          [value]="option.value">{{ option.label }}</option>
                </select>

                <textarea *ngSwitchCase="'textarea'"
                         [formControlName]="field.name"
                         rows="4"
                         class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              </ng-container>
            </div>
          </ng-container>
        </div>

        <button type="submit"
                [disabled]="!supportForm.valid"
                class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50">
          {{ pageContent.submitButton }}
        </button>
      </form>
    </div>
  </div>
</div>
