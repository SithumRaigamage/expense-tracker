<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Search Bar -->
  <div class="col-span-12">
    <div class="bg-white rounded-lg shadow-sm p-6">
      <div class="relative">
        <fa-icon [icon]="searchIcon" class="absolute left-3 top-3 text-gray-400"></fa-icon>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search release notes..."
          class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>
    </div>
  </div>

  <!-- Release Notes List -->
  <div class="col-span-12">
    <div class="bg-white rounded-lg shadow-sm p-6 space-y-6">
      <!-- Release Item -->
      <div *ngFor="let release of filteredReleases"
           class="border border-gray-100 rounded-lg">
        <!-- Release Header -->
        <button (click)="toggleRelease(release)"
                class="w-full flex items-center justify-between p-4 hover:bg-gray-50">
          <div class="flex items-center gap-4">
            <span class="font-medium text-gray-800">Version {{ release.version }}</span>
            <span class="text-sm text-gray-500">{{ release.date | date:'mediumDate' }}</span>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg"
               [class.rotate-180]="release.isExpanded"
               class="w-5 h-5 transition-transform"
               fill="none"
               viewBox="0 0 24 24"
               stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Release Details -->
        <div *ngIf="release.isExpanded" class="p-4 border-t border-gray-100 space-y-4">
          <!-- New Features -->
          <div *ngIf="release.features.length" class="space-y-2">
            <h3 class="flex items-center gap-2 font-medium text-gray-700">
              <fa-icon [icon]="rocketIcon" class="text-blue-500"></fa-icon>
              New Features
            </h3>
            <ul class="space-y-1 text-gray-600">
              <li *ngFor="let feature of release.features" class="flex items-start gap-2">
                <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                {{ feature }}
              </li>
            </ul>
          </div>

          <!-- Bug Fixes -->
          <div *ngIf="release.bugfixes.length" class="space-y-2">
            <h3 class="flex items-center gap-2 font-medium text-gray-700">
              <fa-icon [icon]="bugIcon" class="text-red-500"></fa-icon>
              Bug Fixes
            </h3>
            <ul class="space-y-1 text-gray-600">
              <li *ngFor="let bug of release.bugfixes" class="flex items-start gap-2">
                <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-red-500"></span>
                {{ bug }}
              </li>
            </ul>
          </div>

          <!-- Improvements -->
          <div *ngIf="release.improvements.length" class="space-y-2">
            <h3 class="flex items-center gap-2 font-medium text-gray-700">
              <fa-icon [icon]="speedIcon" class="text-green-500"></fa-icon>
              Improvements
            </h3>
            <ul class="space-y-1 text-gray-600">
              <li *ngFor="let improvement of release.improvements" class="flex items-start gap-2">
                <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-green-500"></span>
                {{ improvement }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
